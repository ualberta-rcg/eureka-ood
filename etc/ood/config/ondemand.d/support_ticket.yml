support_ticket:
  description: |
    Submit a support request for Eureka Open OnDemand. Include steps to reproduce,
    error text, and optionally screenshots/log snippets.

  attachments:
    max_items: 4
    max_size: 6291456

  email:
    to: "rschsppt+eureka@ualberta.ca"
    delivery_method: "smtp"
    delivery_settings:
      address: "smtp.example.org"
      port: 587
      domain: "paice-ua.com"
      user_name: "smtp_user"
      password: "smtp_password"
      authentication: "login"
      enable_starttls_auto: true
      open_timeout: 15
      read_timeout: 15